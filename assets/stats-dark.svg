<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Estatísticas do GitHub: 842 contribuições em 12 meses, 613 commits, 27 repositórios públicos, 19 estrelas. Linguagens: JavaScript 38.4%, HTML 24.1%, CSS 17.6%, Java 12.3%, Python 5.2%, Outras 2.4%">
  <style>
