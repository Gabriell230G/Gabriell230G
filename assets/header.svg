<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="238" viewBox="0 0 1000 238" role="img" aria-label="Gabriel Vasconcellos Gomes, Desenvolvimento e Sustentação de Sistemas · Bradesco">
  <style>
    .nome { font: 800 52px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#FFFFFF; letter-spacing:-1.4px }
    .cargo{ font: 500 18px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#C3CADC }
    .marca{ font: 700 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#FF2D55; letter-spacing:3.4px }
    .chip { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif }
    .drift{ animation: d 18s ease-in-out infinite alternate }
    @keyframes d { from { transform: translate(-26px,6px) } to { transform: translate(34px,-8px) } }
    @media (prefers-reduced-motion: reduce){ .drift{ animation:none } }
  </style>
  <defs>
    <filter id="gBig" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gDot" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gLine" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="wV" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8B5CFF" stop-opacity="0.6"/>
      <stop offset=".55" stop-color="#8B5CFF" stop-opacity="0.228"/>
      <stop offset="1" stop-color="#8B5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wP" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF4D9D" stop-opacity="0.48"/>
      <stop offset=".55" stop-color="#FF4D9D" stop-opacity="0.182"/>
      <stop offset="1" stop-color="#FF4D9D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wR" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF2D55" stop-opacity="0.4"/>
      <stop offset=".55" stop-color="#FF2D55" stop-opacity="0.152"/>
      <stop offset="1" stop-color="#FF2D55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2D55"/>
      <stop offset=".34" stop-color="#FF4D9D"/>
      <stop offset=".68" stop-color="#8B5CFF"/>
      <stop offset="1" stop-color="#22E0D0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020306" stop-opacity="0"/>
      <stop offset="1" stop-color="#020306" stop-opacity=".9"/>
    </linearGradient>
    <clipPath id="cl"><rect width="1000" height="238" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#cl)">
    <rect width="1000" height="238" fill="#020306"/>

    <!-- poliedros de fundo, bem discretos -->
    <g fill="#FFFFFF" fill-opacity=".022">
      <polygon points="640,-40 810,26 742,150 590,96"/>
      <polygon points="880,120 1010,86 1040,210 900,236"/>
      <polygon points="470,150 570,190 520,250 430,214"/>
    </g>

    <g class="drift">
      <ellipse cx="800" cy="44" rx="330" ry="210" fill="url(#wV)"/>
      <ellipse cx="962" cy="196" rx="240" ry="170" fill="url(#wP)"/>
      <ellipse cx="612" cy="232" rx="250" ry="130" fill="url(#wR)"/>
    </g>
    <rect width="1000" height="238" fill="url(#fade)"/>

    <!-- barra viva a esquerda -->
    <rect x="30" y="52" width="5" height="128" rx="2.5" fill="url(#fio)" filter="url(#gLine)"/>

    <text x="60" y="72" class="marca">BRADESCO  ·  FIAP</text>
    <text x="58" y="126" class="nome">Gabriel Vasconcellos Gomes</text>
    <text x="60" y="154" class="cargo">Desenvolvimento e Sustentação de Sistemas</text>

    
    <g>
      <rect x="60" y="172" width="63.7" height="32" rx="16" fill="#8B5CFF" fill-opacity=".10"/>
      <rect x="60" y="172" width="63.7" height="32" rx="16" fill="none" stroke="#8B5CFF" stroke-opacity=".42"/>
      <circle cx="75" cy="188" r="3.4" fill="#8B5CFF" filter="url(#gDot)"/>
      <text x="85" y="193" class="chip" fill="#8B5CFF">Web</text>
    </g>
    <g>
      <rect x="135.7" y="172" width="79.5" height="32" rx="16" fill="#FF4D9D" fill-opacity=".10"/>
      <rect x="135.7" y="172" width="79.5" height="32" rx="16" fill="none" stroke="#FF4D9D" stroke-opacity=".42"/>
      <circle cx="150.7" cy="188" r="3.4" fill="#FF4D9D" filter="url(#gDot)"/>
      <text x="160.7" y="193" class="chip" fill="#FF4D9D">Dados</text>
    </g>
    <g>
      <rect x="227.2" y="172" width="111.10000000000001" height="32" rx="16" fill="#22E0D0" fill-opacity=".10"/>
      <rect x="227.2" y="172" width="111.10000000000001" height="32" rx="16" fill="none" stroke="#22E0D0" stroke-opacity=".42"/>
      <circle cx="242.2" cy="188" r="3.4" fill="#22E0D0" filter="url(#gDot)"/>
      <text x="252.2" y="193" class="chip" fill="#22E0D0">Automação</text>
    </g>
    <g>
      <rect x="350.3" y="172" width="126.9" height="32" rx="16" fill="#FFB020" fill-opacity=".10"/>
      <rect x="350.3" y="172" width="126.9" height="32" rx="16" fill="none" stroke="#FFB020" stroke-opacity=".42"/>
      <circle cx="365.3" cy="188" r="3.4" fill="#FFB020" filter="url(#gDot)"/>
      <text x="375.3" y="193" class="chip" fill="#FFB020">IA aplicada</text>
    </g>

    <rect x="0" y="235" width="1000" height="3" fill="url(#fio)" filter="url(#gLine)"/>
  </g>
</svg>
