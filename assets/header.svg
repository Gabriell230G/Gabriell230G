<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Gabriel Vasconcellos Gomes, Desenvolvimento e Sustentação de Sistemas  ·  Bradesco">
  <style>
    .name { font: 800 44px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill:#FFFFFF; letter-spacing:-.5px }
    .role { font: 500 17px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill:#FFFFFF; fill-opacity:.86 }
    .chip { font: 600 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill:#FFFFFF }
    .glow { animation: drift 14s ease-in-out infinite alternate }
    @keyframes drift { from { transform: translateX(-30px) } to { transform: translateX(40px) } }
    @media (prefers-reduced-motion: reduce) { .glow { animation: none } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12162B"/>
      <stop offset="45%" stop-color="#2A1E52"/>
      <stop offset="100%" stop-color="#4A1B3D"/>
    </linearGradient>
    <radialGradient id="b1" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#6E4BF0" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#6E4BF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx=".5" cy=".5" r=".5">
      <stop offset="0%" stop-color="#ED145B" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#ED145B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CC092F"/>
      <stop offset="33%" stop-color="#ED145B"/>
      <stop offset="66%" stop-color="#6E4BF0"/>
      <stop offset="100%" stop-color="#00A3A3"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="1000" height="200" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="200" fill="url(#bg)"/>
    <g class="glow">
      <ellipse cx="760" cy="30" rx="330" ry="200" fill="url(#b1)"/>
      <ellipse cx="180" cy="200" rx="300" ry="180" fill="url(#b2)"/>
    </g>
    <path d="M0 154 C 180 116, 330 192, 520 160 S 860 124, 1000 166 L 1000 200 L 0 200 Z" fill="#FFFFFF" fill-opacity=".05"/>
    <rect x="0" y="194" width="1000" height="6" fill="url(#line)"/>
    <text x="56" y="84" class="name">Gabriel Vasconcellos Gomes</text>
    <text x="58" y="114" class="role">Desenvolvimento e Sustentação de Sistemas  ·  Bradesco</text>
    <g transform="translate(56 132)">
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="61" height="27" rx="13.5" fill="#FFFFFF" fill-opacity=".14" stroke="#FF5A6E" stroke-opacity=".9"/>
      <circle cx="14" cy="13.5" r="3.5" fill="#FF5A6E"/>
      <text x="24" y="18" class="chip">Web</text>
    </g>
    <g transform="translate(72.8 0)">
      <rect x="0" y="0" width="76" height="27" rx="13.5" fill="#FFFFFF" fill-opacity=".14" stroke="#FFC44D" stroke-opacity=".9"/>
      <circle cx="14" cy="13.5" r="3.5" fill="#FFC44D"/>
      <text x="24" y="18" class="chip">Dados</text>
    </g>
    <g transform="translate(160.8 0)">
      <rect x="0" y="0" width="106" height="27" rx="13.5" fill="#FFFFFF" fill-opacity=".14" stroke="#5AD6A0" stroke-opacity=".9"/>
      <circle cx="14" cy="13.5" r="3.5" fill="#5AD6A0"/>
      <text x="24" y="18" class="chip">Automação</text>
    </g>
    <g transform="translate(279.2 0)">
      <rect x="0" y="0" width="122" height="27" rx="13.5" fill="#FFFFFF" fill-opacity=".14" stroke="#7FB2FF" stroke-opacity=".9"/>
      <circle cx="14" cy="13.5" r="3.5" fill="#7FB2FF"/>
      <text x="24" y="18" class="chip">IA aplicada</text>
    </g>
    </g>
  </g>
</svg>
