<svg xmlns="http://www.w3.org/2000/svg" width="524" height="96" viewBox="0 0 524 96" role="img" aria-label="GABRIEL escrito em uma grade de letras no estilo do jogo Termo">
  <style>
    .ch   { font: 800 34px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill:#FFFFFF; letter-spacing:1px; opacity:0;
            animation: ch 8s ease-in-out infinite }
    .tile { fill-opacity:0; stroke-opacity:.45; transform-box: fill-box; transform-origin: center;
            animation: tile 8s ease-in-out infinite }
    @keyframes tile {
      0%   { fill-opacity:0; stroke-opacity:.45; transform: scaleY(1) }
      4%   { transform: scaleY(1) }
      7%   { transform: scaleY(.06); fill-opacity:0; stroke-opacity:.45 }
      7.5% { fill-opacity:1; stroke-opacity:0 }
      11%  { transform: scaleY(1); fill-opacity:1; stroke-opacity:0 }
      82%  { fill-opacity:1; stroke-opacity:0 }
      88%  { fill-opacity:0; stroke-opacity:.45 }
      100% { fill-opacity:0; stroke-opacity:.45 }
    }
    @keyframes ch {
      0%, 7%   { opacity:0 }
      9%, 82%  { opacity:1 }
      88%,100% { opacity:0 }
    }
    @media (prefers-reduced-motion: reduce) {
      .tile { fill-opacity:1; stroke-opacity:0; animation:none }
      .ch   { opacity:1; animation:none }
    }
  </style>
  <g style="animation-delay:0.00s">
    <rect class="tile" x="18" y="17" width="62" height="62" rx="10" fill="#CC092F" stroke="#8892A0" stroke-width="2" style="animation-delay:0.00s"/>
    <text class="ch" x="49" y="60" text-anchor="middle" style="animation-delay:0.00s">G</text>
  </g>
  <g style="animation-delay:0.28s">
    <rect class="tile" x="89" y="17" width="62" height="62" rx="10" fill="#ED145B" stroke="#8892A0" stroke-width="2" style="animation-delay:0.28s"/>
    <text class="ch" x="120" y="60" text-anchor="middle" style="animation-delay:0.28s">A</text>
  </g>
  <g style="animation-delay:0.56s">
    <rect class="tile" x="160" y="17" width="62" height="62" rx="10" fill="#6E4BF0" stroke="#8892A0" stroke-width="2" style="animation-delay:0.56s"/>
    <text class="ch" x="191" y="60" text-anchor="middle" style="animation-delay:0.56s">B</text>
  </g>
  <g style="animation-delay:0.84s">
    <rect class="tile" x="231" y="17" width="62" height="62" rx="10" fill="#2B7FFF" stroke="#8892A0" stroke-width="2" style="animation-delay:0.84s"/>
    <text class="ch" x="262" y="60" text-anchor="middle" style="animation-delay:0.84s">R</text>
  </g>
  <g style="animation-delay:1.12s">
    <rect class="tile" x="302" y="17" width="62" height="62" rx="10" fill="#00A3A3" stroke="#8892A0" stroke-width="2" style="animation-delay:1.12s"/>
    <text class="ch" x="333" y="60" text-anchor="middle" style="animation-delay:1.12s">I</text>
  </g>
  <g style="animation-delay:1.40s">
    <rect class="tile" x="373" y="17" width="62" height="62" rx="10" fill="#00875A" stroke="#8892A0" stroke-width="2" style="animation-delay:1.40s"/>
    <text class="ch" x="404" y="60" text-anchor="middle" style="animation-delay:1.40s">E</text>
  </g>
  <g style="animation-delay:1.68s">
    <rect class="tile" x="444" y="17" width="62" height="62" rx="10" fill="#D99B0B" stroke="#8892A0" stroke-width="2" style="animation-delay:1.68s"/>
    <text class="ch" x="475" y="60" text-anchor="middle" style="animation-delay:1.68s">L</text>
  </g>
</svg>
