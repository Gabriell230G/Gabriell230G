<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="568" viewBox="0 0 1000 568" role="img" aria-label="Trajetória de Gabriel Vasconcellos Gomes: 2026 Bradesco, Estagiário de Desenvolvimento e Sustentação de Sistemas; 2026 Global Solution Space Connect, Campeão com a UTOPIA, plataforma de inteligência urbana; 2025 FIAP, Bacharelado em Sistemas de Informação, 2025 a 2028; 2023 Clube de Ciências Econômicas, Fundador, mais de 80h de atividades e visitas à FGV e ao IBMEC; 2021 Colégio Presbiteriano Mackenzie, Ensino médio com Honra Acadêmica, entre os cinco melhores alunos; 2010 Judô, Associação Alto da Lapa, Faixa preta, campeão sul-americano e pan-americano">
  <style>
    .year  { font: 700 15px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing:.4px }
