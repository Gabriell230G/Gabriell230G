<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="706" viewBox="0 0 1000 706" role="img" aria-label="Trajetória: 2026 Bradesco, Estagiário de Desenvolvimento e Sustentação de Sistemas; 2026 Global Solution Space Connect, Campeão com a UTOPIA, plataforma de inteligência urbana; 2026 HackGov e Enterprise Challenge, Protege+, plataforma GovTech de denúncias anônimas com a EGESP; 2025 FIAP, Bacharelado em Sistemas de Informação, 2025 a 2028; 2024 Clube das Ciências Econômicas, Cofundador, mais de 80h de atividades e visitas à FGV e ao IBMEC; 2021 Colégio Presbiteriano Mackenzie, Ensino médio com Honra Acadêmica, entre os cinco melhores alunos; 2010 Judô, Associação Alto da Lapa, Faixa preta, campeão sul-americano e pan-americano">
  <style>
    .ano { font: 800 17px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing:.2px }
    .tit { font: 700 17px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#FFFFFF }
    .des { font: 400 13.5px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#6C7590 }
    .row { opacity:0; animation: ent .55s cubic-bezier(.2,.7,.3,1) forwards }
    .rail{ opacity:0; animation: fade 1s ease-out .05s forwards }
    @keyframes ent { from{opacity:0;transform:translateX(-14px)} to{opacity:1;transform:translateX(0)} }
    @keyframes fade{ to{opacity:1} }
    @media (prefers-reduced-motion: reduce){ .row,.rail{opacity:1;animation:none} }
  </style>
  <defs>
    <filter id="gb" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gp" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bl0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2D55" stop-opacity="0.3"/>
      <stop offset=".22" stop-color="#FF2D55" stop-opacity="0.126"/>
      <stop offset=".62" stop-color="#FF2D55" stop-opacity="0"/>
    </linearGradient><linearGradient id="bl1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CFF" stop-opacity="0.3"/>
      <stop offset=".22" stop-color="#8B5CFF" stop-opacity="0.126"/>
      <stop offset=".62" stop-color="#8B5CFF" stop-opacity="0"/>
    </linearGradient><linearGradient id="bl2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22E0D0" stop-opacity="0.3"/>
      <stop offset=".22" stop-color="#22E0D0" stop-opacity="0.126"/>
      <stop offset=".62" stop-color="#22E0D0" stop-opacity="0"/>
    </linearGradient><linearGradient id="bl3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D9D" stop-opacity="0.3"/>
      <stop offset=".22" stop-color="#FF4D9D" stop-opacity="0.126"/>
      <stop offset=".62" stop-color="#FF4D9D" stop-opacity="0"/>
    </linearGradient><linearGradient id="bl4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB020" stop-opacity="0.3"/>
      <stop offset=".22" stop-color="#FFB020" stop-opacity="0.126"/>
      <stop offset=".62" stop-color="#FFB020" stop-opacity="0"/>
    </linearGradient><linearGradient id="bl5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A5C" stop-opacity="0.3"/>
      <stop offset=".22" stop-color="#FF7A5C" stop-opacity="0.126"/>
