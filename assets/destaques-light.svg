<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="168" viewBox="0 0 1000 168" role="img" aria-label="Destaques: 1º Global Solution FIAP, Campeão com a UTOPIA; 4º Mundial de Kata IJF, Sarajevo, 2026; 16 anos de judô, Campeão sul e pan-americano; 3 projetos no ar, Tami, Protege+ e UTOPIA">
  <style>
    .num { font: 800 40px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing:-1.2px }
    .tit { font: 700 15px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#080A12 }
    .des { font: 400 12.5px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill:#767F97 }
    .cd { opacity:0; animation: ent .55s cubic-bezier(.2,.7,.3,1) forwards }
    @keyframes ent { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    @media (prefers-reduced-motion: reduce){ .cd{opacity:1;animation:none} }
  </style>
  <defs><filter id="gb" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter><linearGradient id="bl0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B33D6" stop-opacity="0.12"/>
      <stop offset=".22" stop-color="#5B33D6" stop-opacity="0.050"/>
      <stop offset=".62" stop-color="#5B33D6" stop-opacity="0"/>
    </linearGradient><linearGradient id="bl1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B87400" stop-opacity="0.12"/>
      <stop offset=".22" stop-color="#B87400" stop-opacity="0.050"/>
      <stop offset=".62" stop-color="#B87400" stop-opacity="0"/>
    </linearGradient><linearGradient id="bl2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E9B57" stop-opacity="0.12"/>
      <stop offset=".22" stop-color="#0E9B57" stop-opacity="0.050"/>
      <stop offset=".62" stop-color="#0E9B57" stop-opacity="0"/>
    </linearGradient><linearGradient id="bl3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E9C92" stop-opacity="0.12"/>
      <stop offset=".22" stop-color="#0E9C92" stop-opacity="0.050"/>
      <stop offset=".62" stop-color="#0E9C92" stop-opacity="0"/>
    </linearGradient></defs>
  
  <g class="cd" style="animation-delay:0.00s">
    <rect x="30" y="20" width="223" height="128" rx="16" fill="#FFFFFF"/>
    <rect x="30" y="20" width="223" height="128" rx="16" fill="url(#bl0)"/>
    <rect x="30" y="20" width="223" height="128" rx="16" fill="none" stroke="#5B33D6" stroke-opacity="0.26"/>
    <rect x="30" y="30" width="4" height="108" rx="2" fill="#5B33D6" filter="url(#gb)"/>
    <text x="54" y="78" class="num" fill="#5B33D6">1º</text>
    <text x="54" y="106" class="tit">Global Solution FIAP</text>
    <text x="54" y="127" class="des">Campeão com a UTOPIA</text>
  </g>
  <g class="cd" style="animation-delay:0.09s">
    <rect x="269" y="20" width="223" height="128" rx="16" fill="#FFFFFF"/>
    <rect x="269" y="20" width="223" height="128" rx="16" fill="url(#bl1)"/>
    <rect x="269" y="20" width="223" height="128" rx="16" fill="none" stroke="#B87400" stroke-opacity="0.26"/>
    <rect x="269" y="30" width="4" height="108" rx="2" fill="#B87400" filter="url(#gb)"/>
    <text x="293" y="78" class="num" fill="#B87400">4º</text>
    <text x="293" y="106" class="tit">Mundial de Kata IJF</text>
    <text x="293" y="127" class="des">Sarajevo, 2026</text>
  </g>
  <g class="cd" style="animation-delay:0.18s">
    <rect x="508" y="20" width="223" height="128" rx="16" fill="#FFFFFF"/>
    <rect x="508" y="20" width="223" height="128" rx="16" fill="url(#bl2)"/>
    <rect x="508" y="20" width="223" height="128" rx="16" fill="none" stroke="#0E9B57" stroke-opacity="0.26"/>
    <rect x="508" y="30" width="4" height="108" rx="2" fill="#0E9B57" filter="url(#gb)"/>
    <text x="532" y="78" class="num" fill="#0E9B57">16</text>
    <text x="532" y="106" class="tit">anos de judô</text>
    <text x="532" y="127" class="des">Campeão sul e pan-americano</text>
  </g>
  <g class="cd" style="animation-delay:0.27s">
    <rect x="747" y="20" width="223" height="128" rx="16" fill="#FFFFFF"/>
    <rect x="747" y="20" width="223" height="128" rx="16" fill="url(#bl3)"/>
    <rect x="747" y="20" width="223" height="128" rx="16" fill="none" stroke="#0E9C92" stroke-opacity="0.26"/>
    <rect x="747" y="30" width="4" height="108" rx="2" fill="#0E9C92" filter="url(#gb)"/>
    <text x="771" y="78" class="num" fill="#0E9C92">3</text>
    <text x="771" y="106" class="tit">projetos no ar</text>
    <text x="771" y="127" class="des">Tami, Protege+ e UTOPIA</text>
  </g>
</svg>
